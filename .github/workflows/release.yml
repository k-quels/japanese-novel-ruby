name: Build & release obsidian plugin

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - "*" # Push events to matching any tag format, i.e. 1.0, 20.15.10

env:
  PLUGIN_NAME: japanese-novel-ruby # Change this to the name of your plugin-id folder

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x" # You might need to adjust this value to your own version
      - name: Build
        id: build
        run: |
          npm install
          npm run build
      - name: Package & Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          mkdir "$PLUGIN_NAME"
          cp main.js styles.css manifest.json "$PLUGIN_NAME"
          zip -r "$PLUGIN_NAME-$tag.zip" "$PLUGIN_NAME"

          gh release create "$tag" \
            --title="$tag" \
            --draft \
            main.js styles.css manifest.json "$PLUGIN_NAME-$tag.zip"
name: Build & release obsidian plugin

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - "*" # Push events to matching any tag format, i.e. 1.0, 20.15.10

env:
  PLUGIN_NAME: japanese-novel-ruby # Change this to the name of your plugin-id folder

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Use Node.js
        # zizmor: ignore[cache-poisoning]
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20.x" # You might need to adjust this value to your own version
      - name: Build
        id: build
        run: |
          npm install
          npm run build
      - name: Package
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          mkdir "$PLUGIN_NAME"
          cp main.js styles.css manifest.json "$PLUGIN_NAME"
          zip -r "$PLUGIN_NAME-$tag.zip" "$PLUGIN_NAME"
          echo "TAG_NAME=$tag" >> $GITHUB_ENV
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json
            ${{ env.PLUGIN_NAME }}-${{ env.TAG_NAME }}.zip
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ env.TAG_NAME }}
        run: |
          gh release create "$TAG_NAME" \
            --title="$TAG_NAME" \
            --draft \
            main.js styles.css manifest.json "$PLUGIN_NAME-$TAG_NAME.zip"